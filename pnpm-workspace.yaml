allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@clerk/react@6.12.11'
  - '@clerk/shared@4.26.0'
  # Next.js 16.3.3 is a critical security release (GHSA-p293-qw3h-jr36,
  # GHSA-2xp9-vwfh-vxw4 — unauthenticated RCE, the latter via the Image
  # Optimization API with AVIF, which this site enables). Published
  # 2026-08-25, so it is inside the 72h minimum-release-age window.
  # These entries can be dropped once the window has elapsed.
  - 'next@16.3.3'
  - '@next/env@16.3.3'
  - '@next/mdx@16.3.3'
  - '@next/eslint-plugin-next@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
# Force patched versions of transitive dependencies whose parents still pin a
# vulnerable range (Dependabot / pnpm audit). Drop an entry once its parent
# ships a patched range.
overrides:
  adm-zip@<0.6.1: ^0.6.1
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  katex@<0.18.2: ^0.18.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  postcss@<8.5.23: ^8.5.23
  postcss-selector-parser@<6.1.5: ^6.1.5
  prismjs@<1.30.0: ^1.30.0
  seroval@<1.6.10: ^1.6.10
  uuid@<11.1.1: ^11.1.1
